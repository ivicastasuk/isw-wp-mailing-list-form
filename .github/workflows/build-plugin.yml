name: Build Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip

      - name: Validate PHP syntax
        run: composer lint

      - name: Build plugin archive
        run: composer build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: isw-wp-mailing-list-form
          path: dist/isw-wp-mailing-list-form.zip